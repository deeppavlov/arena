name: arena-sc35-first

x-runtime: &runtime
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 512
  mem_limit: 4g
  cpus: 4
  tmpfs:
    - /tmp:rw,nosuid,size=2g,mode=1777
  restart: unless-stopped

x-evaluator: &evaluator
  <<: *runtime
  image: ${ARENA_EVALUATOR_IMAGE:?}
  command: [python, -m, evaluator]
  group_add: ["${ARENA_DOCKER_GID:?}"]
  environment: &evaluator-environment
    ARENA_CASE_ID: sc35
    ARENA_CAMPAIGN_ID: sc35-first-20261028
    ARENA_DATASET_ID: sc35-unified-v1
    ARENA_CONDITIONS_ID: sc35-first-v1
    ARENA_RELEASE_ID: ${SC35_PRIVATE_RELEASE_ID:?}
    ARENA_METRIC_PATH: /private/metric
    ARENA_MODEL: deepseek-ai/DeepSeek-V4-Flash-0731
    ARENA_MODEL_BASE_URL: http://model-gateway:8081/v1
    ARENA_RUNNER_IMAGE: ${ARENA_HERMES_IMAGE:?}
    ARENA_RUNNER_NETWORK: sc35-first-workers
    ARENA_RUNNER_MODEL_BASE_URL: http://model-gateway:8081/v1
    ARENA_USES_MODEL: "true"
    ARENA_PARAMETERS: '{"reasoning_effort":"max"}'
    ARENA_HARNESSES: '{"hermes":{"image":"${ARENA_HERMES_IMAGE:?}","uses_model":true,"network":"sc35-first-workers","supports_build":true,"supports_asset_selection":true},"sc35-content":{"image":"${ARENA_CONTENT_IMAGE:?}","uses_model":true,"network":"sc35-first-workers","supports_build":false,"supports_asset_selection":false}}'
    ARENA_MODEL_TIMEOUT: "21600"
    ARENA_PREPARE_TIMEOUT: "172800"
    ARENA_RUNNER_TIMEOUT: "604800"
    ARENA_RETRY_DELAY: "30"
    ARENA_RUNNER_MEMORY: 32g
    ARENA_RUNNER_CPUS: "8"
    ARENA_RUNNER_PIDS_LIMIT: "2048"
    ARENA_RUNNER_TMPFS_SIZE: 16g
    ARENA_RUNNER_TMPFS_EXEC: "true"
    ARENA_MAX_BODY_BYTES: "268435456"
    ARENA_ASSETS_DIR: ${ARENA_ROOT}/assets
    ARENA_USAGE_DIR: ${ARENA_ROOT}/operator/usage
    ARENA_TRACE_DIR: ${ARENA_ROOT}/operator/traces
    ARENA_BUILD_DIR: ${ARENA_ROOT}/operator/builds
    ARENA_PUBLISHED_ASSETS_DIR: ${ARENA_ROOT}/derived
    ARENA_SLOT_DIR: ${ARENA_ROOT}/operator/state/capacity
    ARENA_EXECUTION_SLOTS: "4"
    MLFLOW_ENABLE_ASYNC_TRACE_LOGGING: "false"
    ARENA_RUNNER_SUPPORTS_BUILD: "true"
    ARENA_RUNNER_SUPPORTS_ASSET_SELECTION: "true"
    ARENA_INPUT_ASSETS_DIGEST: ${SC35_INPUT_ASSETS_DIGEST:?}
    MLFLOW_TRACKING_URI: http://shared-tracking:5000
    ARENA_OPERATOR_MLFLOW_TRACKING_URI: http://operator-tracking:5000
  volumes: &evaluator-volumes
    - ${ARENA_ROOT}/operator/metric:/private/metric:ro
    - ${ARENA_ROOT}/operator/state:${ARENA_ROOT}/operator/state
    - ${ARENA_ROOT}/operator/usage:${ARENA_ROOT}/operator/usage
    - ${ARENA_ROOT}/operator/traces:${ARENA_ROOT}/operator/traces
    - ${ARENA_ROOT}/assets:${ARENA_ROOT}/assets:ro
    - ${ARENA_ROOT}/secrets:/run/secrets:ro
    - /var/run/docker.sock:/var/run/docker.sock
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
    interval: 30s
    timeout: 5s
    retries: 3

x-gateway: &gateway
  <<: *runtime
  image: ${ARENA_EVALUATOR_IMAGE:?}
  command: [python, -m, evaluator.gateway]
  env_file: ["${ARENA_ROOT:?}/operator/gateway.env"]
  environment: &gateway-environment
    MODEL_NAME: deepseek-ai/DeepSeek-V4-Flash-0731
    MODEL_API_KEY_FILE: /run/secrets/model-api-key
    MODEL_PARAMETERS_JSON: '{"reasoning_effort":"max"}'
    MODEL_RESPONSE_SCHEMAS_JSON: '[]'
    MODEL_STRICT_SCHEMA_INTEGERS: "false"
    MODEL_TIMEOUT: "21600"
    MODEL_RETRY_DELAY: "30"
    MODEL_USAGE_DIR: ${ARENA_ROOT}/operator/usage
    MODEL_TRACE_DIR: ${ARENA_ROOT}/operator/traces
  volumes:
    - ${ARENA_ROOT}/operator/usage:${ARENA_ROOT}/operator/usage
    - ${ARENA_ROOT}/operator/traces:${ARENA_ROOT}/operator/traces
    - ${ARENA_ROOT}/secrets/model-api-key:/run/secrets/model-api-key:ro
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3)"]
    interval: 30s
    timeout: 5s
    retries: 3

services:
  train-evaluator:
    <<: *evaluator
    command: [python, -m, evaluator.train, serve, --host, 0.0.0.0, --port, "8080"]
    depends_on:
      model-gateway: {condition: service_healthy}
    environment:
      <<: *evaluator-environment
      ARENA_SPLIT: public
      ARENA_DATASET_PATH: /private/dataset.jsonl
      ARENA_STATE_DIR: ${ARENA_ROOT}/operator/state/train
      ARENA_TRACKING_DIR: ${ARENA_ROOT}/operator/state/train/tracking
      ARENA_TRACKING_QUEUE_DIR: ${ARENA_ROOT}/operator/state/train/tracking/queue
      ARENA_TOKEN_FILE: /run/secrets/train-token
      ARENA_ASSET_STAGING_DIR: /staging
      ARENA_ASSET_STORE_DIR: ${ARENA_ROOT}/derived
    volumes:
      - ${ARENA_ROOT}/operator/dataset/train/dataset.jsonl:/private/dataset.jsonl:ro
      - ${ARENA_ROOT}/staging:/staging:ro
      - ${ARENA_ROOT}/derived:${ARENA_ROOT}/derived
      - ${ARENA_ROOT}/operator/metric:/private/metric:ro
      - ${ARENA_ROOT}/operator/state:${ARENA_ROOT}/operator/state
      - ${ARENA_ROOT}/operator/builds:${ARENA_ROOT}/operator/builds
      - ${ARENA_ROOT}/operator/usage:${ARENA_ROOT}/operator/usage
      - ${ARENA_ROOT}/operator/traces:${ARENA_ROOT}/operator/traces
      - ${ARENA_ROOT}/assets:${ARENA_ROOT}/assets:ro
      - ${ARENA_ROOT}/secrets:/run/secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["127.0.0.1:18930:8080"]
    networks:
      research: {ipv4_address: 172.31.91.10}
      control: {}
      operator-tracking: {}
  public-evaluator:
    <<: *evaluator
    depends_on:
      train-evaluator: {condition: service_healthy}
    environment:
      <<: *evaluator-environment
      ARENA_SPLIT: public
      ARENA_DATASET_PATH: /private/dataset.jsonl
      ARENA_STATE_DIR: ${ARENA_ROOT}/operator/state/public
      ARENA_TRACKING_DIR: ${ARENA_ROOT}/operator/state/public/tracking
      ARENA_TRACKING_QUEUE_DIR: ${ARENA_ROOT}/operator/state/public/tracking/queue
      ARENA_TOKEN_FILE: /run/secrets/public-token
    volumes:
      - ${ARENA_ROOT}/operator/dataset/public/dataset.jsonl:/private/dataset.jsonl:ro
      - ${ARENA_ROOT}/operator/metric:/private/metric:ro
      - ${ARENA_ROOT}/operator/state:${ARENA_ROOT}/operator/state
      - ${ARENA_ROOT}/operator/builds:${ARENA_ROOT}/operator/builds
      - ${ARENA_ROOT}/operator/usage:${ARENA_ROOT}/operator/usage
      - ${ARENA_ROOT}/operator/traces:${ARENA_ROOT}/operator/traces
      - ${ARENA_ROOT}/assets:${ARENA_ROOT}/assets:ro
      - ${ARENA_ROOT}/derived:${ARENA_ROOT}/derived:ro
      - ${ARENA_ROOT}/secrets:/run/secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["127.0.0.1:18931:8080"]
    networks:
      research: {ipv4_address: 172.31.91.11}
      control: {}
      operator-tracking: {}
  private-evaluator:
    <<: *evaluator
    depends_on:
      train-evaluator: {condition: service_healthy}
    environment:
      <<: *evaluator-environment
      ARENA_SPLIT: private
      ARENA_DATASET_PATH: /private/dataset.jsonl
      ARENA_STATE_DIR: ${ARENA_ROOT}/operator/state/private
      ARENA_TRACKING_DIR: ${ARENA_ROOT}/operator/state/private/tracking
      ARENA_TRACKING_QUEUE_DIR: ${ARENA_ROOT}/operator/state/private/tracking/queue
      ARENA_TOKEN_FILE: /run/secrets/private-token
      ARENA_FINALISTS: ${SC35_FINALISTS:?}
      ARENA_OUTPUT_COUNT: ${SC35_OUTPUT_COUNT:?}
      ARENA_RELEASE_ID: ${SC35_PRIVATE_RELEASE_ID:?}
      ARENA_SEARCH_MODE: campaign
      ARENA_SEARCH_JOURNAL: /search/search.sqlite3
      ARENA_SEARCH_MAX_SOLUTIONS: ${SC35_MAX_SOLUTIONS:?}
      ARENA_SEARCH_STOP_PATH: /operator-search/stop.json
    volumes:
      - campaign-runtime:/search:ro
      - ${ARENA_ROOT}/operator/search:/operator-search:ro
      - ${ARENA_ROOT}/operator/dataset/private/dataset.jsonl:/private/dataset.jsonl:ro
      - ${ARENA_ROOT}/operator/metric:/private/metric:ro
      - ${ARENA_ROOT}/operator/state:${ARENA_ROOT}/operator/state
      - ${ARENA_ROOT}/operator/builds:${ARENA_ROOT}/operator/builds
      - ${ARENA_ROOT}/operator/usage:${ARENA_ROOT}/operator/usage
      - ${ARENA_ROOT}/operator/traces:${ARENA_ROOT}/operator/traces
      - ${ARENA_ROOT}/assets:${ARENA_ROOT}/assets:ro
      - ${ARENA_ROOT}/derived:${ARENA_ROOT}/derived:ro
      - ${ARENA_ROOT}/secrets:/run/secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["127.0.0.1:18932:8080"]
    networks:
      research: {ipv4_address: 172.31.91.12}
      control: {}
      operator-tracking: {}
  model-gateway:
    <<: *gateway
    networks:
      workers: {ipv4_address: 172.31.92.10}
      control: {}
  researcher-gateway:
    <<: *gateway
    environment:
      <<: *gateway-environment
      MODEL_USAGE_DIR: ${ARENA_ROOT}/operator/outer-usage
      MODEL_TRACE_DIR: ${ARENA_ROOT}/operator/outer-traces
    volumes:
      - ${ARENA_ROOT}/operator/outer-usage:${ARENA_ROOT}/operator/outer-usage
      - ${ARENA_ROOT}/operator/outer-traces:${ARENA_ROOT}/operator/outer-traces
      - ${ARENA_ROOT}/secrets/model-api-key:/run/secrets/model-api-key:ro
    networks:
      research: {ipv4_address: 172.31.91.30}
      control: {}
  internet-proxy:
    <<: *runtime
    user: "13:13"
    image: ${ARENA_INFRA_IMAGE:?}
    command: [squid, -N, -f, /etc/squid/squid.conf]
    networks:
      research: {ipv4_address: 172.31.91.40}
      egress: {}
  research-monitor:
    <<: *runtime
    image: ${ARENA_EVALUATOR_IMAGE:?}
    command: [python, -m, integrations.docker.research_monitor, watch, --config, /run/research-monitor.json]
    group_add: ["${ARENA_DOCKER_GID:?}"]
    environment:
      MLFLOW_TRACKING_URI: http://shared-tracking:5000
      ARENA_OPERATOR_MLFLOW_TRACKING_URI: http://operator-tracking:5000
      MLFLOW_ENABLE_ASYNC_TRACE_LOGGING: "false"
    volumes:
      - ${ARENA_ROOT}/operator/research-monitor.json:/run/research-monitor.json:ro
      - ${ARENA_ROOT}/operator/launch:${ARENA_ROOT}/operator/launch:ro
      - ${ARENA_ROOT}/operator/outer-usage:${ARENA_ROOT}/operator/outer-usage
      - ${ARENA_ROOT}/operator/outer-traces:${ARENA_ROOT}/operator/outer-traces:ro
      - ${ARENA_ROOT}/operator/state:${ARENA_ROOT}/operator/state
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [control, operator-tracking]
  researcher:
    <<: *runtime
    profiles: [search]
    image: ${ARENA_HERMES_IMAGE:?}
    entrypoint: [python, /opt/arena/cases/sc71/harness/hermes/researcher.py]
    command:
      - --prompt-file
      - /workspace/cases/sc35/campaigns/sc35-first-20261028/start.md
      - --journal
      - /workspace/cases/sc35/campaigns/sc35-first-20261028/search.sqlite3
      - --private-url
      - http://private-evaluator:8080
      - --private-token-file
      - /run/arena/private-token
      - --private-finalists
      - ${SC35_FINALISTS:?}
      - --private-output-count
      - ${SC35_OUTPUT_COUNT:?}
      - --private-release-id
      - ${SC35_PRIVATE_RELEASE_ID:?}
    mem_limit: 32g
    cpus: 8
    pids_limit: 2048
    restart: "no"
    tmpfs:
      - /tmp:rw,exec,nosuid,size=16g,mode=1777
    working_dir: /workspace
    environment:
      HOME: /workspace/.home
      HERMES_HOME: /workspace/.hermes
      ARENA_MODEL_ACCESS_FILE: /run/arena/model-access.json
      ARENA_CAMPAIGN: sc35-first-20261028
      ARENA_MAX_BUNDLE_BYTES: "268435456"
      MLFLOW_TRACKING_URI: http://shared-tracking:5000
      http_proxy: http://internet-proxy:3128
      https_proxy: http://internet-proxy:3128
      HTTP_PROXY: http://internet-proxy:3128
      HTTPS_PROXY: http://internet-proxy:3128
      no_proxy: localhost,127.0.0.1,researcher-gateway,train-evaluator,public-evaluator,private-evaluator,shared-tracking
      NO_PROXY: localhost,127.0.0.1,researcher-gateway,train-evaluator,public-evaluator,private-evaluator,shared-tracking
    volumes:
      - ${ARENA_ROOT}/workspace:/workspace
      - campaign-runtime:/workspace/cases/sc35/campaigns/sc35-first-20261028
      - ${ARENA_ROOT}/assets:/assets:ro
      - ${ARENA_ROOT}/derived:/assets/derived:ro
      - ${ARENA_ROOT}/staging:/workspace/staging
      - ${ARENA_ROOT}/research-access:/run/arena:ro
    networks: [research]

networks:
  research:
    external: true
    name: sc35-first-researchers
  workers:
    external: true
    name: sc35-first-workers
  control:
    external: true
    name: sc35-first-control
  egress:
    external: true
    name: sc35-first-egress
  operator-tracking:
    external: true
    name: sc35-first-operator-tracking

volumes:
  campaign-runtime:
    external: true
    name: sc35-first-campaign-runtime
