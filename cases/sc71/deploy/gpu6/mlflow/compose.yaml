name: sc71-mlflow
services:
  shared-tracking:
    image: ${SC71_MLFLOW_IMAGE:-sha256:512e48370a8d766fd6ab7237aa1ee12a5d7b59c4b8b812fd71a2f7d159f83d18}
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/backend/tracking.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - '5000'
      - --allowed-hosts
      - localhost:*,127.0.0.1:*,gpu6:*,shared-tracking:*
      - --cors-allowed-origins
      - http://localhost:5052,http://127.0.0.1:5052,http://gpu6:5052
    user: '10001:10001'
    environment:
      HOME: /tmp
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: 'false'
    ports:
      - 127.0.0.1:5052:5000
    volumes:
      - shared-backend:/mlflow/backend
      - shared-artifacts:/mlflow/artifacts
    networks:
      researchers:
        ipv4_address: 172.31.71.20
      control:
        ipv4_address: 172.31.73.20
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped
  operator-tracking:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    entrypoint: [nginx, -g, 'daemon off;']
    user: '10001:10001'
    volumes:
      - ./operator-nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      operator:
        ipv4_address: 172.31.75.3
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
volumes:
  shared-backend:
    external: true
    name: sc71-mlflow-shared-backend
  shared-artifacts:
    external: true
    name: sc71-mlflow-shared-artifacts
networks:
  researchers:
    external: true
    name: sc71-researchers
  control:
    external: true
    name: sc71-control
  operator:
    external: true
    name: sc71-operator-tracking
