name: sc71-second-mlflow
services:
  shared-tracking:
    image: ${SC71_MLFLOW_IMAGE:?}
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/backend/tracking.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --workers
      - '1'
      - --host
      - 0.0.0.0
      - --port
      - '5000'
      - --allowed-hosts
      - localhost:*,127.0.0.1:*,gpu6:*,shared-tracking:*
      - --cors-allowed-origins
      - http://localhost:5053,http://127.0.0.1:5053,http://gpu6:5053
    user: '10001:10001'
    environment:
      HOME: /tmp
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: 'false'
    ports:
      - 127.0.0.1:5053:5000
    volumes:
      - shared-backend:/mlflow/backend
      - shared-artifacts:/mlflow/artifacts
    networks:
      researchers:
        ipv4_address: 172.31.81.20
      control:
        ipv4_address: 172.31.83.20
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped
  operator-tracking:
    image: nginx:1.28-alpine
    entrypoint: [nginx, -g, 'daemon off;']
    user: '10001:10001'
    volumes:
      - ../../../../../deploy/mlflow/operator-nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      operator:
        ipv4_address: 172.31.85.3
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
volumes:
  shared-backend:
    external: true
    name: sc71-second-mlflow-shared-backend
  shared-artifacts:
    external: true
    name: sc71-second-mlflow-shared-artifacts
networks:
  researchers:
    external: true
    name: sc71-second-researchers
  control:
    external: true
    name: sc71-second-control
  operator:
    external: true
    name: sc71-second-operator-tracking
