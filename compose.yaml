name: arena

x-runtime: &runtime
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 2g
  cpus: 2
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m,mode=1777
  restart: unless-stopped

services:
  researcher:
    <<: *runtime
    profiles: [train]
    build:
      context: .
      args:
        ARENA_TRACKING: ${ARENA_TRACKING:-false}
      target: researcher
    image: arena-researcher:local
    stdin_open: true
    tty: true
    restart: "no"
    environment:
      HOME: /tmp
      MLFLOW_TRACKING_URI: ${ARENA_MLFLOW_URL:-}
      ARENA_SEARCH_JOURNAL: ${ARENA_SEARCH_JOURNAL-/search/search.sqlite3}
      ARENA_MODEL_TIMEOUT: ${ARENA_MODEL_TIMEOUT:-21600}
      ARENA_RUNNER_TIMEOUT: ${ARENA_RUNNER_TIMEOUT:-604800}
      ARENA_PREPARE_TIMEOUT: ${ARENA_PREPARE_TIMEOUT:-172800}
      ARENA_RETRY_DELAY: ${ARENA_RETRY_DELAY:-30}
      ARENA_EVALUATOR_TIMEOUT: ${ARENA_EVALUATOR_TIMEOUT:-3600}
    volumes:
      - type: bind
        source: ${ARENA_TRAIN_WORKSPACE:-/srv/arena/train}
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: ${ARENA_SEARCH_DIR:-/srv/arena/search}
        target: /search
        bind:
          create_host_path: false
    networks: [research]

  evaluator:
    <<: *runtime
    profiles: [private]
    build:
      context: .
      args:
        ARENA_TRACKING: ${ARENA_TRACKING:-false}
      target: evaluator
    image: arena-evaluator:local
    command: [python, -m, evaluator]
    group_add:
      - ${ARENA_DOCKER_GID:-999}
    depends_on:
      model-gateway:
        condition: service_healthy
    environment:
      ARENA_DATASET_PATH: /private/dataset.jsonl
      ARENA_METRIC_PATH: /private/metric
      ARENA_STATE_DIR: ${ARENA_STATE_DIR:-/srv/arena/state}
      ARENA_USAGE_DIR: ${ARENA_USAGE_DIR:-/srv/arena/usage}
      ARENA_TOKEN_FILE: /run/secrets/submit-token
      ARENA_MODEL: ${ARENA_MODEL:-unset}
      ARENA_MODEL_BASE_URL: ${ARENA_MODEL_BASE_URL:-http://internal-model.invalid/v1}
      ARENA_MODEL_API_KEY_FILE: /run/secrets/model-api-key
      ARENA_RUNNER_IMAGE: ${ARENA_RUNNER_IMAGE:-unset}
      ARENA_RUNNER_NETWORK: ${ARENA_RUNNER_NETWORK:-arena-runners}
      ARENA_RUNNER_MODEL_BASE_URL: http://model-gateway:8081/v1
      ARENA_ASSETS_DIR: ${ARENA_ASSETS_DIR:-/srv/arena/assets}
      ARENA_RELEASE_ID: ${ARENA_RELEASE_ID:-unset}
      ARENA_FINALISTS: ${ARENA_FINALISTS:-5}
      ARENA_OUTPUT_COUNT: ${ARENA_OUTPUT_COUNT:-1}
      ARENA_SPLIT: ${ARENA_SPLIT:-private}
      ARENA_SEARCH_MODE: ${ARENA_SEARCH_MODE:-campaign}
      ARENA_SEARCH_JOURNAL: ${ARENA_SEARCH_JOURNAL-/search/search.sqlite3}
      ARENA_SEARCH_MAX_SOLUTIONS: ${ARENA_SEARCH_MAX_SOLUTIONS:-}
      ARENA_SEARCH_STOP_PATH: ${ARENA_SEARCH_STOP_PATH-/search-control/stop.json}
      ARENA_USES_MODEL: ${ARENA_USES_MODEL:-true}
      ARENA_HARNESSES: ${ARENA_HARNESSES:-{}}
      ARENA_MAX_BODY_BYTES: ${ARENA_MAX_BODY_BYTES:-73400320}
      ARENA_PARAMETERS: ${ARENA_PARAMETERS:-{}}
      ARENA_MODEL_TIMEOUT: ${ARENA_MODEL_TIMEOUT:-21600}
      ARENA_RUNNER_TIMEOUT: ${ARENA_RUNNER_TIMEOUT:-604800}
      ARENA_PREPARE_TIMEOUT: ${ARENA_PREPARE_TIMEOUT:-172800}
      ARENA_RETRY_DELAY: ${ARENA_RETRY_DELAY:-30}
    volumes:
      - type: bind
        source: ${ARENA_SEARCH_DIR:-/srv/arena/search}
        target: /search
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARENA_SEARCH_CONTROL_DIR:-/srv/arena/search-control}
        target: /search-control
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARENA_DATASET_PATH:-/srv/arena/private/dataset.jsonl}
        target: /private/dataset.jsonl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARENA_METRIC_PATH:-/srv/arena/metric}
        target: /private/metric
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARENA_STATE_DIR:-/srv/arena/state}
        target: ${ARENA_STATE_DIR:-/srv/arena/state}
        bind:
          create_host_path: false
      - type: bind
        source: ${ARENA_ASSETS_DIR:-/srv/arena/assets}
        target: ${ARENA_ASSETS_DIR:-/srv/arena/assets}
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARENA_USAGE_DIR:-/srv/arena/usage}
        target: ${ARENA_USAGE_DIR:-/srv/arena/usage}
        bind:
          create_host_path: false
      - type: bind
        source: ${ARENA_SUBMIT_TOKEN_FILE:-/srv/arena/secrets/submit-token}
        target: /run/secrets/submit-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARENA_MODEL_API_KEY_FILE:-/srv/arena/secrets/model-api-key}
        target: /run/secrets/model-api-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARENA_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${ARENA_EVALUATOR_PORT:-8080}:8080"
    networks: [backend]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  model-gateway:
    <<: *runtime
    profiles: [private]
    build:
      context: .
      args:
        ARENA_TRACKING: ${ARENA_TRACKING:-false}
      target: evaluator
    image: arena-evaluator:local
    command: [python, -m, evaluator.gateway]
    environment:
      MODEL_BASE_URL: ${ARENA_MODEL_BASE_URL:-http://internal-model.invalid/v1}
      MODEL_NAME: ${ARENA_MODEL:-unset}
      MODEL_API_KEY_FILE: /run/secrets/model-api-key
      MODEL_PARAMETERS_JSON: ${ARENA_PARAMETERS:-{}}
      MODEL_TIMEOUT: ${ARENA_MODEL_TIMEOUT:-21600}
      MODEL_RETRY_DELAY: ${ARENA_RETRY_DELAY:-30}
      MODEL_USAGE_DIR: ${ARENA_USAGE_DIR:-/srv/arena/usage}
    volumes:
      - type: bind
        source: ${ARENA_USAGE_DIR:-/srv/arena/usage}
        target: ${ARENA_USAGE_DIR:-/srv/arena/usage}
        bind:
          create_host_path: false
      - type: bind
        source: ${ARENA_MODEL_API_KEY_FILE:-/srv/arena/secrets/model-api-key}
        target: /run/secrets/model-api-key
        read_only: true
        bind:
          create_host_path: false
    networks: [workers, backend]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  research: {}
  backend: {}
  workers:
    name: ${ARENA_RUNNER_NETWORK:-arena-runners}
    internal: true
